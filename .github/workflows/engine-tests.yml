name: Test motore epica
on:
  pull_request:
    paths:
      - 'engine.js'
      - 'storie.js'
      - 'epica-map.js'
      - 'epica-app.js'
      - 'finale.js'
      - 'verifica-app.js'
      - 'verifica.html'
      - 'verifica.css'
      - 'tests/**'
      - '.github/workflows/engine-tests.yml'
  push:
    branches:
      - base-feudo
    paths:
      - 'engine.js'
      - 'storie.js'
      - 'epica-map.js'
      - 'epica-app.js'
      - 'finale.js'
      - 'verifica-app.js'
      - 'verifica.html'
      - 'verifica.css'
      - 'tests/**'
      - '.github/workflows/engine-tests.yml'
jobs:
  engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Node.js version
        run: node --version
      - name: Validate JavaScript syntax
        run: |
          node --check engine.js
          node --check storie.js
          node --check epica-map.js
          node --check epica-app.js
          node --check finale.js
          node --check verifica-app.js
      - name: Test stories and engine
        run: node --test tests/*.test.cjs
