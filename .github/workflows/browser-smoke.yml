name: Browser smoke Epica
on:
  push:
    branches: [base-feudo]
    paths:
      - 'engine.js'
      - 'storie.js'
      - 'epica-app.js'
      - 'epica-map.js'
      - 'epica.css'
      - 'stile.css'
      - 'index.html'
      - 'tests/visual-smoke.cjs'
      - '.github/workflows/browser-smoke.yml'
  pull_request:
    paths:
      - 'engine.js'
      - 'storie.js'
      - 'epica-app.js'
      - 'epica-map.js'
      - 'epica.css'
      - 'stile.css'
      - 'index.html'
      - 'tests/visual-smoke.cjs'
      - '.github/workflows/browser-smoke.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Use system Chromium or Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
      - name: Install lightweight browser driver
        run: npm install --no-save --no-audit --no-fund playwright-core
      - name: Run mobile and desktop flows
        run: node tests/visual-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epica-browser-previews
          path: .artifacts/previews/*.png
          if-no-files-found: ignore
          retention-days: 5
